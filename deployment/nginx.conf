# ==============================================================================
# Astra RAG + AI Agent - Production Nginx Reverse Proxy Configuration
# Optimized for GoDaddy Linux VPS / Dedicated Servers (Ubuntu/Debian)
# ==============================================================================

# Rate limiting zone to protect against brute force / DoS
limit_req_zone $binary_remote_addr zone=astra_limit:10m rate=30r/s;

# Upstream ASGI Backend (Gunicorn + Uvicorn Workers)
upstream astra_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Redirect HTTP to HTTPS (uncomment after obtaining SSL certificate)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    # When SSL is configured, uncomment the following lines and comment the listen 80 lines above:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    
    server_name your-domain.com www.your-domain.com;

    # SSL Certificate Paths (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # Document upload limit (400 MB per file support)
    client_max_body_size 400M;
    client_body_buffer_size 16M;

    # Access & Error Logs
    access_log /var/log/nginx/astra_access.log;
    error_log /var/log/nginx/astra_error.log warn;

    # Gzip Compression for Fast Frontend Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root Directory for Web Previews and Static Fallbacks
    root /opt/astra;

    # Static Assets with High-Performance Caching
    location /static/ {
        alias /opt/astra/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Main Application & API Reverse Proxy
    location / {
        limit_req zone=astra_limit burst=50 nodelay;

        proxy_pass http://astra_backend;
        proxy_http_version 1.1;

        # WebSocket & SSE Streaming Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time AI token streaming (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;

        # Timeouts for RAG processing, vector search, and LLM reasoning
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
